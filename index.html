<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mansi - Product Inventory & Analytics Dashboard</title>
    <style>
        /* Modern UI Style Palette */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 540px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        header {
            background-color: #0f172a;
            color: #ffffff;
            padding: 24px;
            text-align: center;
        }
        header h1 {
            margin: 0 0 6px 0;
            font-size: 22px;
            font-weight: 600;
        }
        header p {
            margin: 0;
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .content {
            padding: 24px;
        }
        .info-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            color: #475569;
            margin-bottom: 20px;
            text-align: center;
        }
        .action-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .action-btn:hover {
            background-color: #0ea5e9;
            color: #ffffff;
        }
        .console-header {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            margin: 20px 0 8px 0;
        }
        /* Custom Console Window output simulator */
        pre {
            background-color: #0f172a;
            color: #38bdf8;
            padding: 18px;
            border-radius: 8px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            overflow-x: auto;
            margin: 0;
            border-left: 4px solid #38bdf8;
            min-height: 250px;
            white-space: pre-wrap;
        }
        footer {
            background-color: #f8fafc;
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dashboard Top Header Section -->
        <header>
            <h1>Capstone Mini Project</h1>
            <p>Interactive Product Inventory & Analytics</p>
        </header>

        <div class="content">
            <div class="info-box">
                💡 Click the execution button below to test data capture prompts, validate type boundaries, and log statistics.
            </div>

            <!-- Interactivity Trigger Button -->
            <button id="runProjectBtn" class="action-btn">🚀 Initialize Inventory Engine</button>

            <div class="console-header">🖥️ Dynamic Console Stream Simulation</div>
            <!-- Terminal Output Element Box -->
            <pre id="displayConsole">System idle. Awaiting initialization...</pre>
        </div>

        <!-- Verification Footer -->
        <footer>
            Submitted by: <strong>mansi</strong>
        </footer>
    </div>

    <!-- Linking our JavaScript Logic Engine file -->
    <script src="script.js"></script>
</body>
</html>
